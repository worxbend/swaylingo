name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: sway-lang-linux-amd64
          - target: aarch64-unknown-linux-gnu
            asset: sway-lang-linux-arm64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: install the arm linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target "${{ matrix.target }}"
      - name: name the asset
        run: cp "target/${{ matrix.target }}/release/sway-lang" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: false
      - name: checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          stage="${RUNNER_TEMP}/release"
          mkdir -p "$stage"
          cp dist/sway-lang-linux-amd64/sway-lang-linux-amd64 "$stage/"
          cp dist/sway-lang-linux-arm64/sway-lang-linux-arm64 "$stage/"
          cp install.sh "$stage/"
          (
            cd "$stage"
            sha256sum sway-lang-linux-amd64 sway-lang-linux-arm64 > SHA256SUMS
          )
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Linux binaries for amd64 and arm64. install.sh checks SHA256SUMS, copies the binary to ~/.local/bin/sway-lang, and writes the systemd user unit. The unit is not enabled." \
            "$stage/sway-lang-linux-amd64" \
            "$stage/sway-lang-linux-arm64" \
            "$stage/SHA256SUMS" \
            "$stage/install.sh"
