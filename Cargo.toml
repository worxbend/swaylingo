[package]
name = "swaylingo"
version = "0.4.0"
edition = "2024"
description = "Per-window keyboard layout daemon for Sway. The binary is skbd."

[[bin]]
name = "skbd"
path = "src/main.rs"

[dependencies]
libc = { version = "0.2", default-features = false }
swayipc = "4"
toml = "0.8"

[dev-dependencies]
serde_json = "1.0.154"
