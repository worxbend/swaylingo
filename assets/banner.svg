<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img">
  <title>Firefox is focused in English. Telegram still remembers Ukrainian.</title>
  <rect width="1280" height="720" fill="#1c1712"/>
  <rect x="80" y="56" width="520" height="340" fill="#14110e" stroke="#9ec4d6" stroke-width="3"/>
  <text x="116" y="104" fill="#9ec4d6" font-family="DejaVu Sans Mono" font-size="16" letter-spacing="2.6">focused</text>
  <text x="116" y="214" fill="#f6f1e7" font-family="DejaVu Serif" font-size="64">Firefox</text>
  <text x="116" y="286" fill="#b3a794" font-family="DejaVu Sans Mono" font-size="28">en</text>
  <rect x="680" y="56" width="520" height="340" fill="#14110e" stroke="#3d342b" stroke-width="3"/>
  <text x="716" y="214" fill="#f6f1e7" font-family="DejaVu Serif" font-size="64">Telegram</text>
  <text x="716" y="286" fill="#b3a794" font-family="DejaVu Sans Mono" font-size="28">ук</text>
  <rect x="450" y="454" width="176" height="158" rx="14" fill="#b7a078"/>
  <rect x="450" y="454" width="176" height="142" rx="14" fill="#f4efe6"/>
  <circle cx="478" cy="482" r="8" fill="#e2a322"/>
  <text x="478" y="546" fill="#221b14" font-family="DejaVu Serif" font-size="54">en</text>
  <text x="478" y="576" fill="#6e655a" font-family="DejaVu Sans Mono" font-size="16">us</text>
  <rect x="654" y="448" width="176" height="164" rx="14" fill="#c8beae"/>
  <rect x="654" y="448" width="176" height="150" rx="14" fill="#f4efe6"/>
  <circle cx="682" cy="476" r="8" fill="#d5ccbf"/>
  <text x="682" y="540" fill="#221b14" font-family="DejaVu Serif" font-size="54">ук</text>
  <text x="682" y="570" fill="#6e655a" font-family="DejaVu Sans Mono" font-size="16">ua</text>
  <text x="640" y="676" fill="#b3a794" font-family="DejaVu Sans Mono" font-size="20" text-anchor="middle">Firefox is English.</text>
</svg>
