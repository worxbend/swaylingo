# Binary only. binstaller rejects installer scripts, so this file does not
# write the systemd unit or the man page. Use install.sh for those.
#
# https://worxbend.github.io/binstaller/
#
# binstaller plan  --config packaging/swaylingo.binstaller.yaml
# binstaller apply --config packaging/swaylingo.binstaller.yaml
#
# `when` keeps the other architecture out. Names are unique because
# binstaller rejects duplicate plan names at load time.
# Checksums are the v0.4.0 lines from SHA256SUMS.

apiVersion: binstaller.io/v1alpha1
kind: BinaryDistributionProfile

metadata:
  name: swaylingo
  annotations:
    binstaller.io/description: skbd from the swaylingo GitHub release.

spec:
  policy:
    mode: strict
    continueOnError: false
    appsDir: "${HOME}/.apps"
    allowSudoSymlinks: false
    stateFile: swaylingo.state.json

  versions:
    swaylingo: v0.4.0

  plan:
    - name: skbd-linux-amd64
      kind: binary-tool
      description: Per-window keyboard layout daemon for Sway.
      when:
        os:
          family: linux
        architecture: amd64
      spec:
        versionRef: swaylingo
        installDir: "${appsDir}/swaylingo"
        download:
          url: "https://github.com/worxbend/swaylingo/releases/download/${version}/skbd-linux-amd64"
          filename: skbd
          checksum:
            algorithm: sha256
            value: a53883abb70c55b1d532e5109591b9079d24d736f7462d4396f84f09df4de4cd
        executables:
          - path: bin/skbd

    - name: skbd-linux-arm64
      kind: binary-tool
      description: Per-window keyboard layout daemon for Sway.
      when:
        os:
          family: linux
        architecture: arm64
      spec:
        versionRef: swaylingo
        installDir: "${appsDir}/swaylingo"
        download:
          url: "https://github.com/worxbend/swaylingo/releases/download/${version}/skbd-linux-arm64"
          filename: skbd
          checksum:
            algorithm: sha256
            value: 4e046087aa0e08ac877c6e6214c05a9d23e44a7661d7f9bdce131d74cc8add43
        executables:
          - path: bin/skbd
